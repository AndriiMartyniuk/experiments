# Experiment stand: gateway-probe + fleet-emulator in containers on one Docker network (Linux network stack).
# Device traffic (CoAP over TCP/TLS) stays inside the network; only the HTTP control/metrics ports reach the host.
#
# Requires: ua.kpi.iot libraries in ~/.m2 (cd lwm2m-objects && ./gradlew publishToMavenLocal) and the dev CA in
# gateway-probe/certs (gateway-probe/scripts/generate-dev-certs.sh). Variables (with defaults) at the services.
name: lwm2m-stand

services:
  probe:
    build:
      context: ../../gateway-probe
      additional_contexts:
        m2: ${HOME}/.m2/repository/ua/kpi/iot
    image: gateway-probe:stand
    # Linux limits of the listening side, recorded by the experiment scripts
    sysctls:
      net.core.somaxconn: ${STAND_SOMAXCONN:-4096}
      net.ipv4.tcp_max_syn_backlog: ${STAND_SYN_BACKLOG:-4096}
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    environment:
      JAVA_TOOL_OPTIONS: ${PROBE_JAVA_OPTS:--Xmx1g}
      PROBE_LWM2M_TCP_PORT: "5683"
      PROBE_LWM2M_TLS_PORT: "5684"
      PROBE_LWM2M_TLS_KEY_STORE: file:/certs/server.p12
      PROBE_LWM2M_TLS_TRUSTED_CERTIFICATES: file:/certs/ca.pem
      PROBE_LWM2M_TRANSPORT_IO_THREADS: ${PROBE_IO_THREADS:-4}
      PROBE_LWM2M_TRANSPORT_BACKLOG: ${PROBE_BACKLOG:-4096}
      PROBE_LWM2M_TRANSPORT_DISPATCH: ${PROBE_DISPATCH:-SINGLE}
      PROBE_STATE_PLACEMENT: IN_MEMORY
      PROBE_EVENT_LOG_ENABLED: "true"
      PROBE_EVENT_LOG_DIRECTORY: /event-log
      PROBE_EVENT_LOG_COAP_MESSAGES: ${PROBE_COAP_MESSAGES:-false}
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    ports:
      - "${STAND_PROBE_HTTP:-18080}:8080"
    volumes:
      - ../../gateway-probe/certs:/certs:ro
      - ${STAND_EVENT_LOG_DIR:-./event-log}:/event-log
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 2s
      timeout: 2s
      retries: 60

  emulator:
    build:
      context: ../../fleet-emulator
      additional_contexts:
        m2: ${HOME}/.m2/repository/ua/kpi/iot
    image: fleet-emulator:stand
    depends_on:
      probe:
        condition: service_healthy
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    environment:
      JAVA_TOOL_OPTIONS: ${EMULATOR_JAVA_OPTS:--Xmx2g}
      EMULATOR_SERVER_HOST: probe
      EMULATOR_SERVER_PORT: "5684"
      EMULATOR_TLS_ENABLED: "true"
      EMULATOR_TLS_CA_CERTIFICATE: /certs/ca.pem
      EMULATOR_TLS_CA_PRIVATE_KEY: /certs/ca.key
      EMULATOR_DEVICES_COUNT: ${DEVICES:-1000}
      EMULATOR_DEVICES_ENDPOINT_PREFIX: t2
      EMULATOR_SENSORS_PER_DEVICE: ${SENSORS:-2}
      EMULATOR_SENSORS_SAMPLE_PERIOD: ${SAMPLE_PERIOD:-1s}
      EMULATOR_CONNECT_RATE_PER_SECOND: ${CONNECT_RATE:-500}
      EMULATOR_CONNECT_IO_THREADS: ${EMULATOR_IO_THREADS:-0}
      EMULATOR_RECONNECT_STRATEGY: ${RECONNECT:-DECORRELATED_JITTER}
      EMULATOR_RECONNECT_BASE_DELAY: ${BASE_DELAY:-200ms}
      EMULATOR_RECONNECT_MAX_DELAY: ${MAX_DELAY:-5s}
    ports:
      - "${STAND_EMULATOR_HTTP:-18090}:8090"
    volumes:
      - ../../gateway-probe/certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 60
